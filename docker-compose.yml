version: '3.8'

# Compose file defining the monitor and recorder services.
services:
  monitor:
    build: .
    container_name: twitch_monitor
    command: ["python", "-u", "twitch_monitor.py"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - internal_ipc
    # Load environment variables from the shared `.env` file.
    env_file:
      - twitch-recorder.env  


    # Mount the host logs directory for persistent container logging.
    volumes:
      - /volume1/VOD/logs/:/VOD/logs:rw
  twitch_recorder:
    build: .
    container_name: twitch_recorder
    command: ["python", "-u", "twitch_recorder.py"]
    restart: unless-stopped

    expose:
      - "9000"
    devices:
      - /dev/dri:/dev/dri
    # Load environment variables from the shared `.env` file.
    env_file:
      - twitch-recorder.env  
      
    # Mount host directories for recordings and logs into the recorder container.
    volumes:
      - /volume1/VOD/recordings/:/VOD/recordings/:rw
      - /volume1/VOD/logs/:/VOD/logs:rw
    networks:
      - internal_ipc  

networks:
  internal_ipc:
    driver: bridge