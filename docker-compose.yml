version: '3.8'

# Docker Compose definition for the monitor and recorder services.
services: 

    # Mount the host logs directory into the monitor container.
    volumes:
      - /volume1/VOD/logs/:/VOD/logs:rw
twitch_recorder:
    build: .
    container_name: twitch_recorder
    restart: unless-stopped

    ports:
      - "9000:9000"
    # Load environment variables from the shared configuration file.
    env_file:
      - twitch-recorder.env  
      
    # Mount host directories for recordings and logs into the recorder container.
    volumes:
      - /volume1/VOD/recordings/:/VOD/recordings/:rw
      - /volume1/VOD/logs/:/VOD/logs:rw
      - ./naspasskey:/root/.ssh/naspasskey:ro